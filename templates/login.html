{% extends "base.html" %}
{% block title %}Log in · Resumsky{% endblock %}
{% block content %}
<style>
  .auth-wrap { max-width: 560px; margin: 3rem auto; }
  .auth-form { display: grid; gap: 1rem; margin-top: 1.25rem; }
  .auth-form label { display: grid; gap: .35rem; font-weight: 600; font-size: .95rem; }
  .auth-form input {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid rgba(128, 128, 128, .4); border-radius: 8px;
    padding: .8rem .9rem; width: 100%; box-sizing: border-box;
  }
  .auth-form input:focus { outline: 2px solid #00A98F; outline-offset: 1px; }
  .auth-form .btn { width: 100%; justify-content: center; text-align: center; }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .label-row a { font-weight: 600; font-size: .85rem; color: #00A98F; text-decoration: none; }
  .label-row a:hover { text-decoration: underline; }
  .or-divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; opacity: .7; font-size: .85rem; }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: rgba(128, 128, 128, .35); }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    width: 100%; box-sizing: border-box; padding: .8rem .9rem; border-radius: 8px;
    border: 1px solid rgba(128, 128, 128, .4); background: #fff; color: #1f2937;
    font: inherit; font-weight: 600; text-decoration: none;
  }
  .google-btn:hover { background: #f3f4f6; }
  .auth-foot { text-align: center; margin-top: 1.25rem; }
  .auth-foot a { font-weight: 700; color: #00A98F; text-decoration: none; }
</style>

<section class="container auth-wrap">
  <div class="card" style="padding: 2.25rem;">
    <h1>Welcome back</h1>

    <form class="auth-form" method="post">
      <label>Email
        <input type="email" name="email" required autofocus autocomplete="email">
      </label>

      <label>
        <span class="label-row">
          <span>Password</span>
          <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        </span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>

      <button class="btn" type="submit">Log in</button>
    </form>

    {% if google_enabled %}
    <div class="or-divider">or</div>
    <a class="google-btn" href="{{ url_for('google_login', next=request.args.get('next')) }}">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
    {% endif %}

    <p class="muted auth-foot">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
