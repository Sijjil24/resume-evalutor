{% extends "base.html" %}
{% block title %}Forgot password · Resumsky{% endblock %}
{% block content %}
<style>
  .auth-wrap { max-width: 560px; margin: 3rem auto; }
  .auth-form { display: grid; gap: 1rem; margin-top: 1.25rem; }
  .auth-form label { display: grid; gap: .35rem; font-weight: 600; font-size: .95rem; }
  .auth-form input {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid rgba(128, 128, 128, .4); border-radius: 8px;
    padding: .8rem .9rem; width: 100%; box-sizing: border-box;
  }
  .auth-form input:focus { outline: 2px solid #00A98F; outline-offset: 1px; }
  .auth-form .btn { width: 100%; justify-content: center; text-align: center; }
  .auth-foot { text-align: center; margin-top: 1.25rem; }
  .auth-foot a { font-weight: 700; color: #00A98F; text-decoration: none; }
</style>

<section class="container auth-wrap">
  <div class="card" style="padding: 2.25rem;">
    <h1>Forgot your password?</h1>
    <p class="muted">Enter your email and we'll send you a link to choose a new one.</p>

    <form class="auth-form" method="post">
      <label>Email
        <input type="email" name="email" required autofocus autocomplete="email">
      </label>
      <button class="btn" type="submit">Send reset link</button>
    </form>

    <p class="muted auth-foot"><a href="{{ url_for('login') }}">Back to log in</a></p>
  </div>
</section>
{% endblock %}
